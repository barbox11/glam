<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" role="img" aria-labelledby="title">
  <title id="title">GLAM by Valen</title>
  <!-- Frame with gaps for butterfly (top) and pill (bottom) -->
  <!-- Left top segment -->
  <path d="M20 105 H 125" stroke="#0F0F12" stroke-width="1.2" fill="none" stroke-linecap="square"/>
  <path d="M215 105 H 320" stroke="#0F0F12" stroke-width="1.2" fill="none"/>
  <!-- Left vertical -->
  <path d="M20 105 V 195 H 108" stroke="#0F0F12" stroke-width="1.2" fill="none"/>
  <path d="M232 195 H 320 V 105" stroke="#0F0F12" stroke-width="1.2" fill="none"/>
  <!-- Bottom gaps handled by pill covering -->
  <!-- Butterfly - one-line art -->
  <g stroke="#0F0F12" stroke-width="1.25" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- left wing upper -->
    <path d="M168 88 C 158 68, 145 42, 158 28 C 168 16, 180 22, 186 38 C 192 52, 188 72, 170 88 Z"/>
    <path d="M170 88 C 165 72, 164 52, 172 44 C 178 38, 183 42, 184 52 C 185 62, 178 78, 170 88 Z"/>
    <!-- right wing upper -->
    <path d="M172 88 C 185 72, 198 52, 206 38 C 214 22, 226 18, 236 30 C 246 42, 240 56, 232 64 C 226 70, 230 78, 225 84 C 218 90, 180 92, 172 88 Z"/>
    <!-- body overlap -->
    <path d="M170 88 C 175 82, 190 78, 202 84 C 214 90, 220 102, 218 114 C 212 126, 198 134, 184 128 C 174 122, 168 110, 170 88 Z"/>
    <!-- lower wing right -->
    <path d="M184 128 C 196 136, 210 138, 220 130 C 232 122, 238 108, 232 98 C 224 88, 210 88, 202 96 C 196 102, 190 114, 184 128 Z"/>
    <!-- lower left tail -->
    <path d="M170 88 C 164 102, 156 118, 148 130 C 142 138, 138 148, 145 152 C 152 154, 158 142, 162 128"/>
    <!-- antennae -->
    <path d="M168 88 C 152 82, 130 68, 122 58 C 118 52, 112 54, 112 60 C 112 66, 120 66, 124 62"/>
    <path d="M167 86 C 154 78, 138 62, 134 52 C 132 46, 126 44, 124 48 C 122 54, 128 56, 132 52"/>
    <!-- small loop at center -->
    <path d="M170 88 C 166 90, 162 94, 164 98 C 166 102, 172 102, 174 98"/>
    <path d="M178 102 C 182 98, 188 96, 192 100 C 196 104, 194 110, 188 112 C 182 114, 176 110, 178 102"/>
  </g>
  <!-- GLAM text -->
  <text x="170" y="168" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="62" font-weight="400" letter-spacing="3" fill="#0F0F12">GLAM</text>
  <!-- Pink pill BY VALEN -->
  <rect x="102" y="178" width="136" height="22" rx="7" fill="#F8B5C8"/>
  <text x="170" y="193" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="400" letter-spacing="5.5" fill="#0F0F12">BY VALEN</text>
</svg>
