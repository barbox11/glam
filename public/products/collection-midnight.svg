<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F0F12"/>
      <stop offset="1" stop-color="#1A1A22"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>

  <!-- crescent moon -->
  <circle cx="500" cy="380" r="140" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="540" cy="360" r="140" fill="#0F0F12"/>

  <!-- stars -->
  <g fill="#FFFFFF" opacity="0.7">
    <circle cx="120" cy="180" r="2"/>
    <circle cx="200" cy="240" r="1.5"/>
    <circle cx="700" cy="160" r="2.5"/>
    <circle cx="640" cy="220" r="1.5"/>
    <circle cx="80" cy="420" r="2"/>
    <circle cx="180" cy="500" r="1.5"/>
    <circle cx="720" cy="500" r="2"/>
  </g>

  <!-- eyeliner arc signature -->
  <path d="M 120 700 Q 400 660 680 740" fill="none" stroke="#E84B8A" stroke-width="3" opacity="0.9" stroke-linecap="round"/>
  <path d="M 120 740 Q 400 700 680 780" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6" stroke-linecap="round"/>

  <!-- mark -->
  <text x="400" y="850" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="22" letter-spacing="10" opacity="0.95">GLAM</text>
  <text x="400" y="878" text-anchor="middle" fill="#E89BB6" font-family="Georgia, serif" font-size="10" letter-spacing="6" opacity="0.7">MIDNIGHT</text>

  <text x="48" y="60" fill="#FFFFFF" font-family="Georgia, serif" font-size="14" letter-spacing="3" opacity="0.55">EDITORIAL</text>
  <text x="752" y="952" text-anchor="end" fill="#FFFFFF" font-family="Georgia, serif" font-size="14" letter-spacing="3" opacity="0.55">MIDNIGHT</text>
</svg>