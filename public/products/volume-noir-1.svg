<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F0F12"/>
      <stop offset="1" stop-color="#1F1F26"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>

  <!-- Mascara -->
  <g transform="translate(400 500)">
    <!-- cap -->
    <rect x="-50" y="-260" width="100" height="160" rx="6" fill="#0F0F12" stroke="#FFFFFF" stroke-width="1"/>
    <!-- gold band -->
    <rect x="-50" y="-110" width="100" height="20" fill="#E89BB6"/>
    <!-- body -->
    <rect x="-50" y="-90" width="100" height="220" rx="6" fill="#0F0F12" stroke="#FFFFFF" stroke-width="1"/>
    <!-- text -->
    <text x="0" y="20" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="16" letter-spacing="6" opacity="0.95">GLAM</text>
    <text x="0" y="44" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="9" letter-spacing="3" opacity="0.6">VOLUME NOIR</text>
    <!-- wand -->
    <rect x="-3" y="130" width="6" height="240" fill="#0F0F12"/>
    <!-- brush bristles -->
    <g transform="translate(0 380)">
      <ellipse rx="22" ry="48" fill="#0F0F12"/>
      <line x1="0" y1="-46" x2="0" y2="46" stroke="#FFFFFF" stroke-width="0.5" opacity="0.3"/>
      <line x1="-10" y1="-40" x2="-10" y2="40" stroke="#FFFFFF" stroke-width="0.5" opacity="0.3"/>
      <line x1="10" y1="-40" x2="10" y2="40" stroke="#FFFFFF" stroke-width="0.5" opacity="0.3"/>
    </g>
  </g>

  <!-- editorial lash swoosh -->
  <path d="M 80 800 Q 300 760 720 820" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.7" stroke-linecap="round"/>

  <text x="48" y="60" fill="#FFFFFF" font-family="Georgia, serif" font-size="14" letter-spacing="3" opacity="0.55">N° 06 · OJOS</text>
  <text x="752" y="952" text-anchor="end" fill="#FFFFFF" font-family="Georgia, serif" font-size="14" letter-spacing="3" opacity="0.55">VOLUME NOIR</text>
</svg>