<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F0F12"/>
      <stop offset="1" stop-color="#1A1A20"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#E84B8A" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#E84B8A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>

  <!-- Eyeliner pen -->
  <g transform="translate(400 500) rotate(-22)">
    <!-- fine tip -->
    <path d="M -260 0 L -180 -4 L -180 4 Z" fill="#FFFFFF"/>
    <rect x="-180" y="-3" width="120" height="6" fill="#0F0F12"/>
    <!-- cap -->
    <rect x="-60" y="-26" width="220" height="52" rx="4" fill="#0F0F12" stroke="#FFFFFF" stroke-width="1" opacity="1"/>
    <rect x="-60" y="-26" width="220" height="52" rx="4" fill="none" stroke="#E84B8A" stroke-width="0.5" opacity="0.4"/>
    <!-- mark -->
    <text x="50" y="6" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="18" letter-spacing="6" opacity="0.95">GLAM</text>
    <!-- tip ring -->
    <circle cx="-60" cy="0" r="14" fill="none" stroke="#E84B8A" stroke-width="1" opacity="0.7"/>
    <!-- end cap -->
    <rect x="160" y="-22" width="14" height="44" rx="2" fill="#E84B8A"/>
  </g>

  <!-- signature line -->
  <path d="M 100 700 Q 400 750 700 680" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.85" stroke-linecap="round"/>
  <path d="M 110 720 Q 410 770 710 700" fill="none" stroke="#E84B8A" stroke-width="2" opacity="0.7" stroke-linecap="round"/>

  <text x="48" y="60" fill="#FFFFFF" font-family="Georgia, serif" font-size="14" letter-spacing="3" opacity="0.55">N° 04 · OJOS</text>
  <text x="752" y="952" text-anchor="end" fill="#FFFFFF" font-family="Georgia, serif" font-size="14" letter-spacing="3" opacity="0.55">MIDNIGHT LINE</text>
</svg>