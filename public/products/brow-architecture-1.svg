<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAF7F5"/>
      <stop offset="1" stop-color="#F4EFEB"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>

  <!-- Brow pencil, triangular -->
  <g transform="translate(400 520) rotate(-18)">
    <!-- wood tip -->
    <path d="M -240 0 L -100 -32 L -100 32 Z" fill="#7A5340"/>
    <path d="M -240 0 L -100 -32 L -100 32 Z" fill="none" stroke="#0F0F12" stroke-width="1"/>
    <!-- pencil body -->
    <rect x="-100" y="-32" width="280" height="64" fill="#5A3621"/>
    <rect x="-100" y="-32" width="280" height="64" fill="none" stroke="#0F0F12" stroke-width="1"/>
    <!-- ferrule -->
    <rect x="180" y="-36" width="20" height="72" fill="#E89BB6"/>
    <!-- end cap -->
    <rect x="200" y="-30" width="60" height="60" rx="4" fill="#0F0F12"/>
    <text x="230" y="6" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="14" letter-spacing="4">GLAM</text>
  </g>

  <!-- brow stroke -->
  <path d="M 130 720 Q 280 700 460 720" fill="none" stroke="#5A3621" stroke-width="8" opacity="0.4" stroke-linecap="round"/>
  <path d="M 460 720 L 700 730" fill="none" stroke="#5A3621" stroke-width="4" opacity="0.4" stroke-linecap="round"/>

  <text x="48" y="60" fill="#0F0F12" font-family="Georgia, serif" font-size="14" letter-spacing="3" opacity="0.55">N° 07 · CEJAS</text>
  <text x="752" y="952" text-anchor="end" fill="#0F0F12" font-family="Georgia, serif" font-size="14" letter-spacing="3" opacity="0.55">BROW ARCHITECTURE</text>
</svg>