<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAF7F5"/>
      <stop offset="1" stop-color="#F8E5EC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#E84B8A" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#E84B8A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>

  <!-- Lipstick silhouette (editorial abstract) -->
  <g transform="translate(400 540)">
    <!-- bullet -->
    <path d="M -70 -180 Q -65 -210 -45 -220 L 45 -220 Q 65 -210 70 -180 L 60 -90 L -60 -90 Z" fill="#C0306B"/>
    <path d="M -70 -180 Q -65 -210 -45 -220 L 45 -220 Q 65 -210 70 -180 L 60 -90 L -60 -90 Z" fill="none" stroke="#9A1F53" stroke-width="1.5" opacity="0.4"/>
    <!-- band -->
    <rect x="-72" y="-90" width="144" height="14" fill="#0F0F12" opacity="0.85"/>
    <!-- body -->
    <rect x="-72" y="-76" width="144" height="240" rx="4" fill="#0F0F12"/>
    <rect x="-72" y="-76" width="144" height="240" rx="4" fill="none" stroke="#3A3A40" stroke-width="1" opacity="0.5"/>
    <!-- shine -->
    <rect x="-50" y="-60" width="6" height="200" rx="3" fill="#FFFFFF" opacity="0.15"/>
    <!-- base -->
    <rect x="-78" y="164" width="156" height="20" rx="2" fill="#0F0F12"/>
    <!-- GLAM mark -->
    <text x="0" y="120" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="22" letter-spacing="6" opacity="0.9">GLAM</text>
  </g>

  <!-- editorial corner mark -->
  <text x="48" y="60" fill="#0F0F12" font-family="Georgia, serif" font-size="14" letter-spacing="3" opacity="0.55">N° 01 · LABIOS</text>
  <text x="752" y="952" text-anchor="end" fill="#0F0F12" font-family="Georgia, serif" font-size="14" letter-spacing="3" opacity="0.55">VELVET KISS</text>
</svg>