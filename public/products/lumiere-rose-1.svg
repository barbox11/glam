<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF2F6"/>
      <stop offset="1" stop-color="#F4EFEB"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E89BB6" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#E89BB6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>

  <!-- Highlight compact -->
  <g transform="translate(400 500)">
    <!-- main puck body -->
    <circle r="190" fill="#0F0F12"/>
    <circle r="190" fill="none" stroke="#3A3A40" stroke-width="2" opacity="0.4"/>
    <!-- embossed ring -->
    <circle r="170" fill="none" stroke="#E84B8A" stroke-width="1" opacity="0.4"/>
    <!-- highlighter powder dome -->
    <ellipse cx="0" cy="-30" rx="120" ry="60" fill="#E89BB6" opacity="0.9"/>
    <ellipse cx="0" cy="-40" rx="100" ry="40" fill="#FDF2F6" opacity="0.7"/>
    <ellipse cx="-30" cy="-50" rx="30" ry="10" fill="#FFFFFF" opacity="0.9"/>
    <!-- center GLAM monogram -->
    <text y="40" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="24" letter-spacing="6" opacity="0.95">GLAM</text>
    <!-- base shadow -->
    <ellipse cx="0" cy="220" rx="200" ry="20" fill="#0F0F12" opacity="0.08"/>
  </g>

  <text x="48" y="60" fill="#0F0F12" font-family="Georgia, serif" font-size="14" letter-spacing="3" opacity="0.55">N° 02 · ROSTRO</text>
  <text x="752" y="952" text-anchor="end" fill="#0F0F12" font-family="Georgia, serif" font-size="14" letter-spacing="3" opacity="0.55">LUMIÈRE ROSE</text>
</svg>