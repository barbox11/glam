<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF2F6"/>
      <stop offset="1" stop-color="#F4EFEB"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>

  <!-- Nail polish bottle -->
  <g transform="translate(400 500)">
    <!-- cap -->
    <rect x="-44" y="-300" width="88" height="180" rx="4" fill="#0F0F12"/>
    <!-- neck -->
    <rect x="-32" y="-130" width="64" height="20" fill="#C0306B"/>
    <!-- bottle -->
    <path d="M -90 -110 Q -90 -130 -70 -130 L 70 -130 Q 90 -130 90 -110 L 90 160 Q 90 180 70 180 L -70 180 Q -90 180 -90 160 Z" fill="#E84B8A"/>
    <path d="M -90 -110 Q -90 -130 -70 -130 L 70 -130 Q 90 -130 90 -110 L 90 160 Q 90 180 70 180 L -70 180 Q -90 180 -90 160 Z" fill="none" stroke="#9A1F53" stroke-width="2"/>
    <!-- shine -->
    <rect x="-60" y="-90" width="14" height="250" rx="6" fill="#FFFFFF" opacity="0.45"/>
    <rect x="-38" y="-70" width="4" height="120" rx="2" fill="#FFFFFF" opacity="0.35"/>
    <!-- label -->
    <rect x="-70" y="20" width="140" height="100" rx="2" fill="#FFFFFF" opacity="0.95"/>
    <text y="58" text-anchor="middle" fill="#0F0F12" font-family="Georgia, serif" font-size="14" letter-spacing="5">GLAM</text>
    <text y="80" text-anchor="middle" fill="#0F0F12" font-family="Georgia, serif" font-size="10" letter-spacing="3" opacity="0.7">LAQUER ROSÉ</text>
    <line x1="-40" y1="92" x2="40" y2="92" stroke="#0F0F12" stroke-width="0.5" opacity="0.3"/>
    <text y="108" text-anchor="middle" fill="#0F0F12" font-family="Georgia, serif" font-size="8" letter-spacing="2" opacity="0.5">13 ml</text>
  </g>

  <text x="48" y="60" fill="#0F0F12" font-family="Georgia, serif" font-size="14" letter-spacing="3" opacity="0.55">N° 08 · UÑAS</text>
  <text x="752" y="952" text-anchor="end" fill="#0F0F12" font-family="Georgia, serif" font-size="14" letter-spacing="3" opacity="0.55">LAQUER ROSÉ</text>
</svg>